<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<title>BALLVAULT — Baseball Collection</title>
<style>
:root{
  --bg:#f4f6f8; --card:#fff; --ink:#101828; --muted:#667085;
  --line:#e4e7ec; --dark:#111827; --dark2:#1f2937; --accent:#d92d20;
  --soft:#f2f4f7; --success:#067647; --shadow:0 12px 35px rgba(16,24,40,.08);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{min-height:100vh}
.topbar{height:74px;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:-.03em}
.logo{width:38px;height:38px;border-radius:12px;background:var(--dark);color:white;display:grid;place-items:center;font-size:20px}
.brand-title{font-size:20px}.brand-sub{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.top-actions{display:flex;gap:10px;align-items:center}
.icon-btn,.ghost-btn{border:1px solid var(--line);background:white;color:var(--ink);border-radius:12px;padding:10px 13px}
.primary{background:var(--dark);color:white;border:0;border-radius:12px;padding:11px 16px;font-weight:700}
.primary:hover{background:#000}
.layout{display:flex;max-width:1440px;margin:auto}
.sidebar{width:230px;padding:26px 16px;border-right:1px solid var(--line);min-height:calc(100vh - 74px);position:sticky;top:74px;align-self:flex-start}
.nav-title{font-size:11px;color:#98a2b3;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin:8px 12px 10px}
.nav-item{width:100%;display:flex;align-items:center;gap:11px;padding:12px;border:0;background:transparent;border-radius:12px;color:#475467;text-align:left;font-weight:650;margin-bottom:4px}
.nav-item.active,.nav-item:hover{background:white;color:var(--ink);box-shadow:0 3px 12px rgba(16,24,40,.05)}
.main{flex:1;padding:30px;min-width:0}
.page{display:none}.page.active{display:block}
.hero{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;margin-bottom:26px}
.eyebrow{font-size:12px;color:var(--muted);font-weight:800;letter-spacing:.12em;text-transform:uppercase}
h1{margin:5px 0 8px;font-size:34px;letter-spacing:-.045em}
.subtitle{color:var(--muted);margin:0;line-height:1.6}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}
.stat-label{color:var(--muted);font-size:13px;font-weight:650}.stat-num{font-size:30px;font-weight:800;margin-top:8px;letter-spacing:-.04em}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;padding:13px 15px 13px 42px;border:1px solid var(--line);background:white;border-radius:13px;outline:none}
.search span{position:absolute;left:15px;top:12px;color:#98a2b3}
.filter{padding:12px 13px;border:1px solid var(--line);background:white;border-radius:13px;color:#344054}
.collection-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.ball-card{background:white;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 7px 25px rgba(16,24,40,.06);transition:.18s}
.ball-card:hover{transform:translateY(-2px);box-shadow:0 14px 32px rgba(16,24,40,.10)}
.card-photo{height:210px;background:#eaecf0;position:relative;overflow:hidden}
.card-photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo-placeholder{height:100%;display:grid;place-items:center;color:#98a2b3;font-size:52px}
.type-pill{position:absolute;top:12px;left:12px;background:rgba(17,24,39,.84);color:white;padding:7px 10px;border-radius:999px;font-size:11px;font-weight:800;backdrop-filter:blur(8px)}
.favorite{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.92);font-size:19px}
.favorite.on{color:#d92d20}
.card-body{padding:17px}
.card-title{font-size:18px;font-weight:800;letter-spacing:-.02em;margin-bottom:5px}
.card-meta{color:var(--muted);font-size:13px;line-height:1.55;min-height:40px}
.card-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:15px;padding-top:13px;border-top:1px solid #f0f2f5}
.date{font-size:12px;color:#98a2b3}.more{border:0;background:transparent;color:#667085;font-size:20px}
.empty{background:white;border:1px dashed #cfd4dc;border-radius:20px;padding:65px 25px;text-align:center;color:var(--muted)}
.empty .big{font-size:46px;margin-bottom:12px}.empty h3{margin:0 0 7px;color:var(--ink)}
.list{background:white;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.list-row{display:flex;justify-content:space-between;align-items:center;padding:17px 20px;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:0}.row-left{display:flex;align-items:center;gap:12px}.mini-avatar{width:40px;height:40px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:20px}
.row-title{font-weight:750}.row-sub{font-size:12px;color:var(--muted);margin-top:3px}
.modal-wrap{display:none;position:fixed;inset:0;background:rgba(16,24,40,.48);z-index:50;padding:20px;overflow:auto}
.modal-wrap.open{display:flex;align-items:center;justify-content:center}
.modal{width:min(760px,100%);background:white;border-radius:24px;box-shadow:0 25px 80px rgba(0,0,0,.2);overflow:hidden}
.modal-head{padding:21px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal-head h2{margin:0;font-size:21px}.close{border:0;background:var(--soft);width:36px;height:36px;border-radius:10px;font-size:18px}
.form{padding:24px;display:grid;gap:17px}
.type-selector{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.type-option{border:1px solid var(--line);background:white;border-radius:13px;padding:13px 10px;text-align:left}
.type-option strong{display:block;font-size:13px}.type-option small{color:var(--muted);font-size:11px}
.type-option.selected{border-color:#111827;background:#f8fafc;box-shadow:inset 0 0 0 1px #111827}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.field{display:grid;gap:7px}.field.full{grid-column:1/-1}
.field label{font-size:12px;font-weight:750;color:#344054}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px 12px;outline:none;background:white}
.field textarea{min-height:90px;resize:vertical}
.photo-box{border:1px dashed #cfd4dc;border-radius:15px;padding:15px;background:#fafafa}
.photo-preview{display:none;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.photo-preview.show{display:grid}.photo-preview img{width:100%;height:92px;object-fit:cover;border-radius:10px}
.modal-foot{padding:17px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px}
.toast{position:fixed;right:22px;bottom:22px;background:#101828;color:white;padding:13px 17px;border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.2);display:none;z-index:100}
.toast.show{display:block}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.detail-card{background:white;border:1px solid var(--line);border-radius:20px;padding:20px}
.detail-photo{width:100%;aspect-ratio:1.25;background:#eaecf0;border-radius:15px;overflow:hidden}.detail-photo img{width:100%;height:100%;object-fit:cover}
.info-line{padding:11px 0;border-bottom:1px solid #f0f2f5;display:flex;justify-content:space-between;gap:15px}.info-line:last-child{border:0}.info-line span:first-child{color:var(--muted);font-size:12px}.info-line span:last-child{text-align:right;font-weight:650}
.back{margin-bottom:18px;border:0;background:transparent;color:#475467;padding:0;font-weight:700}
.analytics{display:grid;grid-template-columns:1fr 1fr;gap:18px}.bar-row{display:grid;grid-template-columns:120px 1fr 35px;gap:10px;align-items:center;margin:13px 0;font-size:12px}.bar{height:9px;background:#eaecf0;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:#111827;border-radius:999px}
@media(max-width:1050px){.collection-grid{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.topbar{padding:0 15px}.brand-sub{display:none}.sidebar{position:fixed;bottom:0;left:0;right:0;top:auto;width:auto;min-height:0;height:66px;background:rgba(255,255,255,.96);border-right:0;border-top:1px solid var(--line);z-index:30;padding:7px;display:flex;justify-content:space-around}.nav-title{display:none}.nav-item{width:auto;margin:0;display:grid;gap:1px;justify-items:center;padding:7px 10px;font-size:10px}.nav-item span:first-child{font-size:18px}.main{padding:20px 15px 90px}.hero{display:block}.hero .primary{margin-top:15px}.collection-grid{grid-template-columns:1fr}.stats{gap:9px}.stat{padding:15px}.stat-num{font-size:24px}.form-grid,.detail-grid,.analytics{grid-template-columns:1fr}.type-selector{grid-template-columns:1fr 1fr}.top-actions .ghost-btn{display:none}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand"><div class="logo">⚾</div><div><div class="brand-title">BALLVAULT</div><div class="brand-sub">Baseball Collection</div></div></div>
  <div class="top-actions"><button class="ghost-btn" onclick="exportData()">Export</button><button class="primary" onclick="openAdd()">＋ Add Ball</button></div>
</header>

<div class="layout">
<aside class="sidebar">
  <div class="nav-title">Collection</div>
  <button class="nav-item active" data-page="home" onclick="go('home',this)"><span>⌂</span><span>首頁</span></button>
  <button class="nav-item" data-page="collection" onclick="go('collection',this)"><span>⚾</span><span>我的收藏</span></button>
  <button class="nav-item" data-page="favorites" onclick="go('favorites',this)"><span>★</span><span>最愛</span></button>
  <div class="nav-title">Explore</div>
  <button class="nav-item" data-page="players" onclick="go('players',this)"><span>♙</span><span>球員</span></button>
  <button class="nav-item" data-page="teams" onclick="go('teams',this)"><span>▣</span><span>球隊</span></button>
  <button class="nav-item" data-page="analytics" onclick="go('analytics',this)"><span>◒</span><span>分析</span></button>
</aside>

<main class="main">
<section id="page-home" class="page active">
  <div class="hero"><div><div class="eyebrow">My Baseball Collection</div><h1>我的棒球收藏</h1><p class="subtitle">把每一顆球保存成一段棒球記憶。</p></div><button class="primary" onclick="openAdd()">＋ 新增收藏</button></div>
  <div class="stats" id="stats"></div>
  <div class="hero" style="align-items:center;margin-bottom:14px"><div><h2 style="margin:0;font-size:20px">最近收藏</h2></div><button class="ghost-btn" onclick="goByName('collection')">查看全部 →</button></div>
  <div id="recent"></div>
</section>

<section id="page-collection" class="page">
  <div class="hero"><div><div class="eyebrow">Collection</div><h1>我的收藏</h1><p class="subtitle">所有收藏都集中在這裡。</p></div><button class="primary" onclick="openAdd()">＋ 新增收藏</button></div>
  <div class="toolbar"><div class="search"><span>⌕</span><input id="searchInput" placeholder="搜尋球員、球隊、球場、筆記…" oninput="renderCollection()"></div><select id="typeFilter" class="filter" onchange="renderCollection()"><option value="">全部類型</option></select><select id="sortFilter" class="filter" onchange="renderCollection()"><option value="new">最新收藏</option><option value="old">最早收藏</option><option value="az">名稱 A–Z</option></select></div>
  <div id="collection"></div>
</section>

<section id="page-favorites" class="page">
  <div class="hero"><div><div class="eyebrow">Favorites</div><h1>最愛收藏</h1><p class="subtitle">特別想保留的那些球。</p></div></div>
  <div id="favorites"></div>
</section>

<section id="page-players" class="page">
  <div class="hero"><div><div class="eyebrow">Players</div><h1>球員</h1><p class="subtitle">依球員整理你的收藏。</p></div></div>
  <div id="players"></div>
</section>

<section id="page-teams" class="page">
  <div class="hero"><div><div class="eyebrow">Teams</div><h1>球隊</h1><p class="subtitle">看看哪些球隊出現在你的收藏裡。</p></div></div>
  <div id="teams"></div>
</section>

<section id="page-analytics" class="page">
  <div class="hero"><div><div class="eyebrow">Analytics</div><h1>收藏分析</h1><p class="subtitle">只分析收藏數量，不涉及價格或估值。</p></div></div>
  <div id="analytics"></div>
</section>

<section id="page-detail" class="page">
  <button class="back" onclick="goByName('collection')">← 返回收藏</button>
  <div id="detail"></div>
</section>
</main>
</div>
</div>

<div id="modal" class="modal-wrap" onclick="if(event.target===this)closeModal()">
<div class="modal">
  <div class="modal-head"><h2 id="modalTitle">新增棒球收藏</h2><button class="close" onclick="closeModal()">×</button></div>
  <form class="form" onsubmit="saveBall(event)">
    <div class="field"><label>收藏類型</label><div class="type-selector" id="typeSelector"></div></div>
    <div class="form-grid" id="dynamicFields"></div>
    <div class="field full"><label>照片（可選，可一次選多張）</label><div class="photo-box"><input id="photos" type="file" accept="image/*" multiple onchange="previewPhotos(event)"><div class="photo-preview" id="photoPreview"></div></div></div>
  </form>
  <div class="modal-foot"><button class="ghost-btn" onclick="closeModal()">取消</button><button class="primary" onclick="document.querySelector('.form').requestSubmit()">儲存收藏</button></div>
</div>
</div>
<div class="toast" id="toast"></div>

<script>
const TYPES = {
 signed:{label:"簽名球",icon:"✍️",desc:"球員親筆簽名"},
 foul:{label:"界外球",icon:"⚾",desc:"比賽中取得"},
 practice:{label:"球員送的練習球",icon:"🏃",desc:"球員／練習場取得"},
 team:{label:"球隊隊徽球",icon:"🛡️",desc:"球隊 Logo 球"},
 commemorative:{label:"紀念球",icon:"🏆",desc:"特殊紀念版本"},
 other:{label:"其他",icon:"⭐",desc:"自訂收藏類型"}
};
const STORAGE="ballvault_v1";
let balls=JSON.parse(localStorage.getItem(STORAGE)||"[]");
let editingId=null, selectedType="signed", pendingPhotos=[];

function saveStore(){localStorage.setItem(STORAGE,JSON.stringify(balls));}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function fmtDate(v){if(!v)return "未記錄日期"; const d=new Date(v+"T00:00:00"); return isNaN(d)?"":d.toLocaleDateString("zh-TW",{year:"numeric",month:"short",day:"numeric"});}
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),2200);}
function go(page,btn){
 document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
 document.getElementById("page-"+page).classList.add("active");
 document.querySelectorAll(".nav-item").forEach(x=>x.classList.remove("active"));
 if(btn)btn.classList.add("active"); else document.querySelector(`[data-page="${page}"]`)?.classList.add("active");
 if(page==="home")renderHome(); if(page==="collection")renderCollection(); if(page==="favorites")renderFavorites();
 if(page==="players")renderPeople("player"); if(page==="teams")renderPeople("team"); if(page==="analytics")renderAnalytics();
 window.scrollTo({top:0,behavior:"smooth"});
}
function goByName(p){go(p,document.querySelector(`[data-page="${p}"]`));}
function openAdd(ball=null){
 editingId=ball?.id||null; selectedType=ball?.type||"signed"; pendingPhotos=ball?.photos||[];
 document.getElementById("modalTitle").textContent=ball?"編輯收藏":"新增棒球收藏";
 document.getElementById("modal").classList.add("open");
 renderTypeSelector(); renderFields(ball); renderPhotoPreview();
}
function closeModal(){document.getElementById("modal").classList.remove("open");editingId=null;pendingPhotos=[];}
function renderTypeSelector(){
 document.getElementById("typeSelector").innerHTML=Object.entries(TYPES).map(([k,t])=>`<button type="button" class="type-option ${selectedType===k?"selected":""}" onclick="selectedType='${k}';renderTypeSelector();renderFields()"><strong>${t.icon} ${t.label}</strong><small>${t.desc}</small></button>`).join("");
}
function field(name,label,type="text",value="",placeholder="",required=false,extra=""){
 return `<div class="field"><label>${label}${required?" *":""}</label><input id="f_${name}" type="${type}" value="${esc(value)}" placeholder="${esc(placeholder)}" ${required?"required":""} ${extra}></div>`;
}
function renderFields(ball=null){
 const b=ball||{};
 let html="";
 if(selectedType==="signed"){
  html+=field("title","收藏名稱","text",b.title||"","例如：大谷翔平簽名球",true);
  html+=field("player","球員姓名","text",b.player||"","例如：大谷翔平",true);
  html+=field("team","球隊","text",b.team||"","例如：Los Angeles Dodgers");
  html+=field("number","背號","text",b.number||"","例如：17");
  html+=field("date","簽名／取得日期","date",b.date||"");
  html+=field("location","取得地點","text",b.location||"","例如：東京巨蛋");
  html+=field("method","取得方式","text",b.method||"","例如：球員親簽、活動");
  html+=`<div class="field"><label>簽名證明</label><select id="f_proof"><option value="">未記錄</option><option ${b.proof==="有"?"selected":""}>有</option><option ${b.proof==="無"?"selected":""}>無</option></select></div>`;
 }else if(selectedType==="foul"){
  html+=field("title","收藏名稱","text",b.title||"","例如：2026 巨人對戰界外球",true);
  html+=field("date","比賽日期","date",b.date||"");
  html+=field("team","主隊","text",b.team||"");
  html+=field("opponent","對戰球隊","text",b.opponent||"");
  html+=field("player","擊球／相關球員","text",b.player||"","知道再填即可");
  html+=field("location","球場","text",b.location||"","例如：Tokyo Dome");
  html+=field("method","取得方式","text",b.method||"","例如：觀眾席接到");
 }else if(selectedType==="practice"){
  html+=field("title","收藏名稱","text",b.title||"","例如：球員送的練習球",true);
  html+=field("player","球員姓名","text",b.player||"","例如：大谷翔平",true);
  html+=field("team","球隊","text",b.team||"");
  html+=field("date","日期","date",b.date||"");
  html+=field("location","地點","text",b.location||"","例如：球場外／練習場");
  html+=field("method","取得方式","text",b.method||"","例如：球員送給球迷");
 }else if(selectedType==="team"){
  html+=field("title","收藏名稱","text",b.title||"","例如：Dodgers 隊徽球",true);
  html+=field("team","球隊","text",b.team||"","例如：Los Angeles Dodgers",true);
  html+=field("league","聯盟","text",b.league||"","例如：MLB");
  html+=field("season","年份","text",b.season||"","例如：2026");
  html+=field("version","球款／版本","text",b.version||"","例如：官方隊徽球");
  html+=field("date","取得日期","date",b.date||"");
  html+=field("location","取得地點","text",b.location||"");
 }else if(selectedType==="commemorative"){
  html+=field("title","收藏名稱","text",b.title||"","例如：World Series 紀念球",true);
  html+=field("team","相關球隊","text",b.team||"");
  html+=field("event","紀念活動／賽事","text",b.event||"");
  html+=field("season","年份","text",b.season||"");
  html+=field("date","取得日期","date",b.date||"");
  html+=field("location","取得地點","text",b.location||"");
 }else{
  html+=field("title","收藏名稱","text",b.title||"","例如：我的特別棒球",true);
  html+=field("player","球員","text",b.player||"");
  html+=field("team","球隊","text",b.team||"");
  html+=field("date","日期","date",b.date||"");
  html+=field("location","取得地點","text",b.location||"");
 }
 html+=`<div class="field full"><label>收藏筆記／故事</label><textarea id="f_notes" placeholder="記下這顆球為什麼特別……">${esc(b.notes||"")}</textarea></div>`;
 document.getElementById("dynamicFields").innerHTML=html;
}
function previewPhotos(e){
 pendingPhotos=[];
 const files=[...e.target.files].slice(0,6);
 if(!files.length){renderPhotoPreview();return}
 let done=0;
 files.forEach(file=>{
  const reader=new FileReader();
  reader.onload=ev=>{pendingPhotos.push(ev.target.result);done++;if(done===files.length)renderPhotoPreview();}
  reader.readAsDataURL(file);
 });
}
function renderPhotoPreview(){
 const el=document.getElementById("photoPreview");
 if(!pendingPhotos.length){el.classList.remove("show");el.innerHTML="";return}
 el.classList.add("show");el.innerHTML=pendingPhotos.map(x=>`<img src="${x}">`).join("");
}
function val(id){return document.getElementById("f_"+id)?.value?.trim()||""}
function saveBall(e){
 e.preventDefault();
 const old=balls.find(x=>x.id===editingId);
 const b={...(old||{}),id:editingId||uid(),type:selectedType,title:val("title"),player:val("player"),team:val("team"),date:val("date"),location:val("location"),method:val("method"),notes:val("notes"),photos:pendingPhotos.length?pendingPhotos:(old?.photos||[]),updatedAt:new Date().toISOString()};
 ["number","proof","opponent","league","season","version","event"].forEach(k=>{const x=document.getElementById("f_"+k);if(x)b[k]=x.value.trim()});
 if(!old)b.createdAt=b.updatedAt;
 if(editingId)balls=balls.map(x=>x.id===editingId?b:x);else balls.unshift(b);
 saveStore();closeModal();renderAll();toast(editingId?"收藏已更新":"已加入收藏");
}
function renderAll(){renderHome();renderCollection();renderFavorites();renderPeople("player");renderPeople("team");renderAnalytics();populateTypeFilter();}
function card(b){
 const t=TYPES[b.type]||TYPES.other, img=b.photos?.[0];
 const subtitle=[b.player,b.team].filter(Boolean).join(" · ")||b.location||"未補充資料";
 return `<article class="ball-card">
 <div class="card-photo">${img?`<img src="${img}" alt="">`:`<div class="photo-placeholder">${t.icon}</div>`}<span class="type-pill">${t.icon} ${t.label}</span><button class="favorite ${b.favorite?"on":""}" onclick="event.stopPropagation();toggleFav('${b.id}')">${b.favorite?"★":"☆"}</button></div>
 <div class="card-body" onclick="detail('${b.id}')" style="cursor:pointer"><div class="card-title">${esc(b.title||t.label)}</div><div class="card-meta">${esc(subtitle)}<br>${fmtDate(b.date)}</div><div class="card-bottom"><span class="date">${b.notes?"有收藏故事":"尚未加入筆記"}</span><button class="more" onclick="event.stopPropagation();detail('${b.id}')">···</button></div></div>
 </article>`;
}
function grid(list){
 if(!list.length)return `<div class="empty"><div class="big">⚾</div><h3>還沒有收藏</h3><p>按右上角「新增收藏」，把第一顆球加入 BALLVAULT。</p><button class="primary" onclick="openAdd()">＋ 新增第一顆球</button></div>`;
 return `<div class="collection-grid">${list.map(card).join("")}</div>`;
}
function renderHome(){
 const c=balls.length,s=balls.filter(x=>x.type==="signed").length,f=balls.filter(x=>x.favorite).length,teams=new Set(balls.map(x=>x.team).filter(Boolean)).size;
 document.getElementById("stats").innerHTML=`<div class="stat"><div class="stat-label">總收藏</div><div class="stat-num">${c}</div></div><div class="stat"><div class="stat-label">✍️ 簽名球</div><div class="stat-num">${s}</div></div><div class="stat"><div class="stat-label">🏟️ 收藏球隊</div><div class="stat-num">${teams}</div></div><div class="stat"><div class="stat-label">★ 最愛</div><div class="stat-num">${f}</div></div>`;
 document.getElementById("recent").innerHTML=grid(balls.slice(0,6));
}
function populateTypeFilter(){
 const el=document.getElementById("typeFilter"), old=el.value;
 el.innerHTML='<option value="">全部類型</option>'+Object.entries(TYPES).map(([k,t])=>`<option value="${k}">${t.icon} ${t.label}</option>`).join("");
 el.value=old;
}
function renderCollection(){
 let list=[...balls], q=(document.getElementById("searchInput")?.value||"").toLowerCase(), type=document.getElementById("typeFilter")?.value||"", sort=document.getElementById("sortFilter")?.value||"new";
 if(q)list=list.filter(b=>Object.values(b).join(" ").toLowerCase().includes(q));
 if(type)list=list.filter(b=>b.type===type);
 if(sort==="new")list.sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||""));
 if(sort==="old")list.sort((a,b)=>(a.createdAt||"").localeCompare(b.createdAt||""));
 if(sort==="az")list.sort((a,b)=>(a.title||"").localeCompare(b.title||""));
 document.getElementById("collection").innerHTML=grid(list);
}
function renderFavorites(){document.getElementById("favorites").innerHTML=grid(balls.filter(x=>x.favorite));}
function renderPeople(kind){
 const key=kind==="player"?"player":"team"; const map={};
 balls.forEach(b=>{const n=b[key];if(n){map[n]=(map[n]||0)+1}});
 const entries=Object.entries(map).sort((a,b)=>b[1]-a[1]);
 const el=document.getElementById(kind==="player"?"players":"teams");
 if(!entries.length){el.innerHTML=`<div class="empty"><div class="big">${kind==="player"?"♙":"▣"}</div><h3>還沒有資料</h3><p>新增收藏後，這裡會自動整理。</p></div>`;return}
 el.innerHTML=`<div class="list">${entries.map(([n,c])=>`<div class="list-row"><div class="row-left"><div class="mini-avatar">${kind==="player"?"♙":"▣"}</div><div><div class="row-title">${esc(n)}</div><div class="row-sub">${c} 顆收藏</div></div></div><button class="ghost-btn" onclick="filterBy('${kind}','${encodeURIComponent(n)}')">查看</button></div>`).join("")}</div>`;
}
function filterBy(kind,n){goByName("collection");document.getElementById("searchInput").value=decodeURIComponent(n);renderCollection();}
function renderAnalytics(){
 const total=balls.length;
 const counts={};Object.keys(TYPES).forEach(k=>counts[k]=balls.filter(b=>b.type===k).length);
 const typeRows=Object.entries(counts).filter(([,n])=>n>0);
 const teams={};balls.forEach(b=>{if(b.team)teams[b.team]=(teams[b.team]||0)+1});
 const teamRows=Object.entries(teams).sort((a,b)=>b[1]-a[1]).slice(0,8);
 const bars=(rows,icon=false)=>rows.length?rows.map(([n,c])=>`<div class="bar-row"><span>${icon?"":esc(n)}</span><div class="bar"><i style="width:${total?c/Math.max(...rows.map(x=>x[1]))*100:0}%"></i></div><strong>${c}</strong></div>`).join(""):`<p class="subtitle">尚無資料。</p>`;
 document.getElementById("analytics").innerHTML=`<div class="analytics"><div class="detail-card"><h3>收藏類型</h3>${bars(typeRows)}</div><div class="detail-card"><h3>球隊收藏排行</h3>${bars(teamRows)}</div></div>`;
}
function detail(id){
 const b=balls.find(x=>x.id===id);if(!b)return;const t=TYPES[b.type]||TYPES.other;
 document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));document.getElementById("page-detail").classList.add("active");
 document.querySelectorAll(".nav-item").forEach(x=>x.classList.remove("active"));
 document.getElementById("detail").innerHTML=`<div class="hero"><div><div class="eyebrow">${t.icon} ${t.label}</div><h1>${esc(b.title||t.label)}</h1><p class="subtitle">${esc([b.player,b.team].filter(Boolean).join(" · "))}</p></div><div class="top-actions"><button class="ghost-btn" onclick="openAdd(balls.find(x=>x.id==='${b.id}'))">編輯</button><button class="ghost-btn" onclick="deleteBall('${b.id}')">刪除</button></div></div>
 <div class="detail-grid"><div class="detail-card"><div class="detail-photo">${b.photos?.[0]?`<img src="${b.photos[0]}">`:`<div class="photo-placeholder">${t.icon}</div>`}</div></div>
 <div class="detail-card"><h3 style="margin-top:0">收藏資料</h3>${info("收藏類型",t.label)}${b.player?info("球員",b.player):""}${b.team?info("球隊",b.team):""}${b.number?info("背號","#"+b.number):""}${b.opponent?info("對戰球隊",b.opponent):""}${b.league?info("聯盟",b.league):""}${b.season?info("年份",b.season):""}${b.version?info("版本",b.version):""}${b.date?info("日期",fmtDate(b.date)):""}${b.location?info("地點",b.location):""}${b.method?info("取得方式",b.method):""}${b.proof?info("簽名證明",b.proof):""}</div>
 <div class="detail-card" style="grid-column:1/-1"><h3 style="margin-top:0">收藏故事</h3><p style="line-height:1.8;color:#475467;white-space:pre-wrap">${esc(b.notes||"還沒有寫下故事。")}</p></div></div>`;
 window.scrollTo({top:0,behavior:"smooth"});
}
function info(a,b){return `<div class="info-line"><span>${esc(a)}</span><span>${esc(b)}</span></div>`}
function toggleFav(id){balls=balls.map(b=>b.id===id?{...b,favorite:!b.favorite}:b);saveStore();renderAll();toast(balls.find(b=>b.id===id).favorite?"已加入最愛":"已取消最愛");}
function deleteBall(id){if(!confirm("確定要刪除這顆收藏嗎？此操作無法復原。"))return;balls=balls.filter(b=>b.id!==id);saveStore();goByName("collection");renderAll();toast("收藏已刪除");}
function exportData(){
 const blob=new Blob([JSON.stringify(balls,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="ballvault-collection.json";a.click();URL.revokeObjectURL(a.href);toast("收藏資料已匯出");
}
renderAll();
</script>
</body>
</html>
